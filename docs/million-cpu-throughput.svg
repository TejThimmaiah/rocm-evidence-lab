<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">Million-vector CPU validation: throughput by batch size</title>
<desc id="desc">Batch 1: 7.77 queries per second. Batch 32: 34.88 queries per second. Three repetitions, one warmup. Both pass correctness. ROCm GPU validation pending.</desc>
<rect width="960" height="380" rx="16" fill="#111827"/>
<g font-family="Arial, sans-serif" fill="#f9fafb">
<text x="32" y="44" font-size="23" font-weight="700">Million-vector CPU validation</text>
<text x="32" y="74" font-size="15" fill="#cbd5e1">1,000,000 vectors × 384 dimensions · 64 queries · float32</text>
<text x="32" y="109" font-size="14" fill="#cbd5e1">Throughput (queries/second) · higher is better</text>
<text x="32" y="157" font-size="17">Batch 1</text>
<text x="32" y="217" font-size="17">Batch 32</text>
<rect x="150" y="132" width="124.31" height="36" rx="4" fill="#94a3b8"/>
<rect x="150" y="192" width="558.07" height="36" rx="4" fill="#22d3ee"/>
<text x="286.31" y="157" font-size="17">7.77</text>
<text x="720.07" y="217" font-size="17">34.88</text>
<line x1="150" y1="244" x2="790" y2="244" stroke="#64748b"/>
<text x="150" y="265" text-anchor="middle" font-size="13" fill="#cbd5e1">0</text><text x="310" y="265" text-anchor="middle" font-size="13" fill="#cbd5e1">10</text><text x="470" y="265" text-anchor="middle" font-size="13" fill="#cbd5e1">20</text><text x="630" y="265" text-anchor="middle" font-size="13" fill="#cbd5e1">30</text><text x="790" y="265" text-anchor="middle" font-size="13" fill="#cbd5e1">40</text>
<text x="32" y="306" font-size="16">Both pass score tolerance and 100% mean top-10 agreement.</text>
<text x="32" y="334" font-size="14" fill="#fcd34d">3 repetitions / 1 warmup: validation only; not a stable performance estimate.</text>
<text x="32" y="358" font-size="14" fill="#cbd5e1">Hosted CPU run · ROCm GPU unvalidated · no CPU/GPU comparison</text>
</g></svg>